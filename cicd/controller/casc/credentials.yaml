# Credenciais, lidas de /run/secrets pelo SecretSource de arquivo do JCasC.
#
# `${chave}` aqui resolve para o CONTEÚDO de /run/secrets/chave, porque o
# Dockerfile define SECRETS=/run/secrets. É a mesma convenção do config.go e do
# config.py desta stack — segredo é arquivo montado, nunca variável de ambiente.
#
# Um arquivo separado do jenkins.yaml de propósito: o JCasC lê todos os .yaml
# do diretório, e separar "o Jenkins" de "os segredos" deixa o diff de
# configuração legível sem expor onde as credenciais moram.
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "registry-token"
              description: "Token de exemplo, para a lição sobre mascaramento no log"
              secret: "${registry_token}"
