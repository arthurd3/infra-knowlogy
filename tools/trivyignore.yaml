# Exceções de scanner — cada uma com motivo e DATA DE VALIDADE.
#
# Este arquivo existe porque a alternativa é pior. Quando um scanner acusa algo
# que você não pode corrigir hoje, há três reações possíveis:
#
#   1. baixar o limiar de severidade  → o portão para de ver TUDO que é HIGH;
#   2. desligar o scanner             → o portão vira enfeite;
#   3. registrar a exceção, com motivo e prazo  → é o que fazemos aqui.
#
# `expired_at` é a parte que importa. Passada a data, o Trivy volta a reportar
# a CVE e o build fica vermelho de novo — a exceção não vira permanente por
# esquecimento. Uma exceção sem prazo é só uma supressão com boa reputação.
#
# Revisar em 2026-11-30: se a imagem oficial do Caddy tiver sido republicada
# com um Go mais novo, basta apagar este bloco inteiro e re-pinar o digest.

vulnerabilities:
  # ── CVEs dentro do BINÁRIO do Caddy (usr/bin/caddy) ────────────────────────
  #
  # Contexto: a imagem oficial `caddy:2-alpine` mais recente (verificada em
  # 2026-08-31 — as tags 2-alpine e 2.11-alpine apontam para o mesmo digest)
  # é compilada com Go 1.26.3. Todas as CVEs abaixo estão na stdlib do Go ou em
  # dependências linkadas estaticamente no binário.
  #
  # Por que não conseguimos corrigir: um binário Go é estático. Não há pacote
  # para atualizar — o conserto é o mantenedor do Caddy recompilar e republicar.
  # `apk upgrade` (que já aplicamos no site/Dockerfile) corrige os pacotes do
  # Alpine, mas não toca no binário.
  #
  # Por que o risco é aceitável AQUI: este binário serve o site estático de
  # lições, sem entrada de usuário, atrás do proxy `edge`, numa rede sem saída
  # e com o rootfs read-only. As CVEs são majoritariamente negação de serviço
  # por entrada malformada; o pior caso é o site cair — não há dado para vazar.
  #
  # A alternativa avaliada e recusada: compilar o Caddy nós mesmos a partir de
  # um Go atual. Resolveria, e acrescentaria uma toolchain inteira de build para
  # manter — trabalho desproporcional para servir HTML estático.

  - id: CVE-2026-27145
    paths: ["usr/bin/caddy"]
    statement: "stdlib do Go no binário upstream do Caddy; sem correção disponível a montante."
    expired_at: 2026-11-30
