# Loki em modo monolítico (single binary) — adequado para uma stack de um host.
# Loki NÃO indexa o conteúdo do log; ele indexa apenas os rótulos e guarda o
# texto comprimido. É por isso que ele custa uma fração de um Elasticsearch —
# e também por que rótulo de alta cardinalidade (request_id, user_id) o destrói.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retenção. Sem isto o volume cresce até encher o disco — o mesmo erro que
  # o max-size do log driver evita do outro lado.
  retention_period: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  reject_old_samples_max_age: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
