apiVersion: 1

providers:
  - name: infra-knowlogy
    orgId: 1
    folder: infra-knowlogy
    type: file
    disableDeletion: false
    # Dashboards vivem em arquivo JSON no git. Editar na UI é permitido para
    # experimentar, mas o arquivo é a fonte da verdade e volta a valer no
    # próximo restart.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
