# compose.obs.yaml — a camada de OBSERVABILIDADE.
#
# Uso: docker compose -f compose.yaml -f compose.prod.yaml -f compose.obs.yaml \
#        --profile obs up -d --wait          (ou `make obs`)
#
# Tudo aqui está sob o profile `obs`: sem `--profile obs`, o Compose ignora
# estes serviços por completo. É assim que a stack do dia a dia continua subindo
# em segundos, e você paga os ~600 MB de RAM do monitoramento só quando quer.
#
# ─── A nota honesta sobre o socket do Docker ────────────────────────────────
# A Regra #1 da OWASP é clara: nunca monte /var/run/docker.sock num container.
# Quem fala com o socket pode criar um container privilegiado montando / do
# host — ou seja, o socket É root no host, sem exagero nenhum.
#
# Mas coletar logs e métricas POR CONTAINER exige, por definição, perguntar ao
# Docker quais containers existem. A tensão é real e não tem solução perfeita.
# O que fazemos aqui:
#   1. O Alloy NÃO vê o socket. Ele fala com o docker-socket-proxy, que expõe
#      apenas os endpoints de LEITURA de /containers e recusa todo o resto.
#   2. O cAdvisor precisa de mais do que a API — ele lê cgroups direto de /sys —
#      então ele recebe o socket, mas :ro e com todas as capabilities dropadas.
#      `:ro` limita o dano; não o elimina (a API do Docker é HTTP sobre o
#      socket, e :ro impede escrita no arquivo, não requisições POST).
#   3. Nada disto é obrigatório: `make up` sobe a stack inteira sem um único
#      container tocando o socket.
# Ver docs/adr/0003-socket-do-docker-na-observabilidade.md.

services:

  # ─── Fronteira de segurança do socket ──────────────────────────────────────
  docker-socket-proxy:
    profiles: [obs]
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      # Allowlist mínima: só listar e inspecionar containers. Tudo o que não
      # está aqui é negado — inclusive POST /containers/create, que é o
      # endpoint que transformaria o acesso em root no host.
      CONTAINERS: 1
      # O Alloy também consulta /networks para rotular os alvos com a rede em
      # que cada container está ("computing network labels"). Sem isto ele leva
      # 403 e não descobre nada. Continua sendo LEITURA: o `POST: 0` abaixo é
      # que impede criar, conectar ou remover qualquer rede.
      NETWORKS: 1
      # Explicitamente negados (o padrão já é 0; declarar documenta a intenção).
      # O mais importante é o POST: é ele que barra /containers/create, o
      # endpoint que transformaria este acesso em root no host.
      POST: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      SERVICES: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      TASKS: 0
      BUILD: 0
      COMMIT: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]
    security_opt:
      - no-new-privileges:true
      # Em distribuição com SELinux, /var/run/docker.sock é rotulado
      # `container_var_run_t` e o tipo `container_t` do container não tem acesso.
      # O sintoma é cruel: o container SOBE, o HAProxy fica de pé, e toda
      # requisição volta 503 "No server is available" — nada menciona SELinux.
      #
      # Verificável em dois comandos:
      #   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro alpine/curl \
      #     curl -s --unix-socket /var/run/docker.sock http://localhost/_ping   # nada
      #   ...o mesmo comando com --security-opt label=disable                   # OK
      #
      # Usamos label=disable AQUI, e só aqui, de propósito: este container é a
      # fronteira que restringe a API do Docker por allowlist. Abrir mão do
      # confinamento SELinux nele é o preço de não montar o socket em mais
      # ninguém. A alternativa — `:z` no socket — reetiquetaria o socket DO HOST,
      # afetando o daemon e todo o resto que fala com ele.
      - label=disable
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 100}

  # ─── Métricas ──────────────────────────────────────────────────────────────
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retenção explícita. O padrão de 15 dias enche disco sem avisar.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./services/observability/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # Nas DUAS redes: `obs` para ser alcançável e publicar porta, `data` para
    # conseguir raspar a api, o worker e os exporters — que vivem lá dentro.
    networks: [obs, data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 768M, pids: 200}

  # ─── Roteamento de alerta ──────────────────────────────────────────────────
  # O Prometheus decide QUANDO um alerta está `firing`; o Alertmanager decide
  # para quem, quando e se avisar. Sem esta metade, o `firing` é um estado numa
  # página web que ninguém está olhando às três da manhã.
  #
  # A imagem vem do **quay.io** e não do Docker Hub: o Hub limita pull anônimo
  # por IP, e uma stack de estudo que falha ao subir porque alguém já puxou
  # muita imagem hoje é uma stack que ninguém consegue rodar. O Prometheus
  # publica nos dois registries.
  alertmanager:
    profiles: [obs]
    image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # O Alertmanager precisa saber o próprio endereço para os links de
      # silenciamento que ele põe na notificação funcionarem.
      - --web.external-url=http://127.0.0.1:${ALERTMANAGER_PORT:-9093}
    volumes:
      - ./services/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [obs]
    user: "65534:65534"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M, pids: 100}

  # O outro lado do webhook. Um alerta "que sai" precisa de alguém recebendo,
  # senão o Alertmanager só incrementa notifications_FAILED_total — que também
  # é medível, e prova o contrário do que a lição quer.
  #
  # Reusa a imagem do Caddy que a stack já carrega: zero imagem nova.
  alert-sink:
    profiles: [obs]
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./services/observability/alert-sink.Caddyfile:/etc/caddy/Caddyfile:ro,z
    networks: [obs]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /config:rw,noexec,nosuid,size=8m
      - /data:rw,noexec,nosuid,size=8m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # O binário do Caddy tem cap_net_bind_service gravado nele, e o kernel
    # recusa o exec() sem ela no bounding set — mesmo publicando em porta alta
    # (armadilha 6 do CLAUDE.md).
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: "0.10", memory: 32M, pids: 50}

  cadvisor:
    profiles: [obs]
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    restart: unless-stopped
    command:
      # Reduz drasticamente o volume de métricas coletadas na fonte. O
      # metric_relabel_configs do Prometheus é a segunda barreira.
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks: [obs]
    security_opt:
      - no-new-privileges:true
      # O cAdvisor faz inotify em /sys/fs/cgroup do host. Sob SELinux, o rótulo
      # do container impede isso e ele morre com "permission denied" — mesmo
      # com o bind mount :ro presente. Desligar o rótulo é uma concessão real,
      # e é o motivo de todo este serviço viver atrás de um profile opcional.
      - label=disable
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M, pids: 200}

  node-exporter:
    profiles: [obs]
    image: prom/node-exporter:v1.10.1@sha256:b01f6d5e6945d5001894165cce46a80fd8d0cfee68c35c8b251c50d8d446ba75
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker)($$|/)
    volumes:
      # Monta o host inteiro em modo leitura. Isto é observabilidade do HOST,
      # não dos containers — e é exatamente por isso que ele precisa enxergar
      # /proc e /sys reais. Só suba este serviço se você confia no que roda nele.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [obs]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pid: host
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M, pids: 100}

  postgres-exporter:
    profiles: [obs]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB:-links}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-links}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [obs, data]
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M, pids: 100}

  redis-exporter:
    profiles: [obs]
    image: oliver006/redis_exporter:v1.83.0@sha256:e8c209894d4c0cc55b1259ddd47e0b769ad1ff864b356736ee885462a3b0e48c
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://cache:6379"
    networks: [obs, data]
    depends_on:
      cache: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 100}

  # ─── Logs ──────────────────────────────────────────────────────────────────
  loki:
    profiles: [obs]
    image: grafana/loki:3.5.9@sha256:db10fa05fda2a21b77d187b034a0739a33dc84814cfe8644ace90e7d04ad923b
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./services/observability/loki.yaml:/etc/loki/loki.yaml:ro,z
      - loki_data:/loki
    networks: [obs]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 512M, pids: 200}

  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.13.1@sha256:03529aec781901a72a354809650028435043406e707c6fb8953dc6e48f97727d
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./services/observability/config.alloy:/etc/alloy/config.alloy:ro,z
      # Montado em /var/lib/alloy e NÃO em /var/lib/alloy/data. Um volume
      # nomeado herda dono e permissões do diretório que a imagem já tem naquele
      # caminho; apontando para um subdiretório inexistente, o Docker cria um
      # volume vazio pertencente ao root e o Alloy (que roda como não-root) não
      # consegue escrever nele.
      - alloy_data:/var/lib/alloy
    networks: [obs]
    depends_on:
      loki: {condition: service_healthy}
      docker-socket-proxy: {condition: service_started}
    # A imagem do Alloy roda como root por padrão, mas /var/lib/alloy pertence
    # a alloy:alloy com modo 0770. Root só escreveria ali via CAP_DAC_OVERRIDE —
    # que o cap_drop: [ALL] tira. Em vez de devolver a capability, rodamos como
    # o usuário dono do diretório: menos privilégio, e o problema desaparece.
    user: "473:473"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M, pids: 200}

  # ─── Visualização ──────────────────────────────────────────────────────────
  grafana:
    profiles: [obs]
    image: grafana/grafana:12.3.1@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      # Desliga a telemetria e a checagem de versão: nada sai desta stack.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_password]
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./services/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [obs]
    depends_on:
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 384M, pids: 200}

networks:
  obs:
    driver: bridge

volumes:
  alertmanager_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

secrets:
  grafana_password:
    file: ./secrets/grafana_password
