# web — o porte do serviço `web` do compose.yaml: o site estático de lições,
# servido pelo Caddy embutido na própria imagem (stage `dist` de site/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: infra-knowlogy/web:dev
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            failureThreshold: 4
          # ≙ compose.prod: mesma imagem Caddy do edge, mesma exigência de
          # NET_BIND_SERVICE — o binário do Caddy tem a file capability
          # cap_net_bind_service=+ep gravada nele, e o kernel recusa o exec()
          # se ela não estiver no bounding set (o erro não menciona
          # capabilities em momento algum).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, SETGID, SETUID]
          resources:
            limits: {cpu: "500m", memory: 128Mi}
            requests: {memory: 32Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: caddy-data, mountPath: /data}
            - {name: caddy-config, mountPath: /config}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: caddy-data
          emptyDir: {sizeLimit: 32Mi}
        - name: caddy-config
          emptyDir: {sizeLimit: 8Mi}
