# O nome `api` no DNS do cluster. O Caddyfile do edge fala com api:8080 —
# o MESMO arquivo do módulo Docker resolve aqui sem mudar uma linha.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8080, targetPort: http}
