# ≙ a api nas redes `edge` + `data` do Compose: recebe do proxy, fala com o
# banco e o cache — e nada de internet (a api não estava na rede `egress`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: edge}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels: {app: db}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels: {app: cache}
      ports:
        - {protocol: TCP, port: 6379}
