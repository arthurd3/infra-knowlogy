# ≙ o cache na rede `data` com `internal: true` — mesma lógica do db.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache
spec:
  podSelector:
    matchLabels: {app: cache}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: worker}
      ports:
        - {protocol: TCP, port: 6379}
